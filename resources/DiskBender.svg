<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="ridges" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="16" fill="#333333"/>
      <rect x="8" width="8" height="16" fill="#2b2b2b"/>
    </pattern>
    <mask id="diskMask">
      <rect x="0" y="0" width="1024" height="1024" fill="white" />
      <rect x="152" y="20" width="36" height="52" fill="black" rx="6" />
      <rect x="836" y="20" width="36" height="52" fill="black" rx="6" />
    </mask>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="50%" stop-color="#d0d0d0" />
      <stop offset="100%" stop-color="#a0a0a0" />
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0b0b0" />
      <stop offset="50%" stop-color="#909090" />
      <stop offset="100%" stop-color="#707070" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.7" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g mask="url(#diskMask)" filter="url(#dropShadow)">
    <!-- Disk Body -->
    <rect x="128" y="32" width="768" height="960" rx="32" fill="url(#ridges)" />
    <rect x="128" y="32" width="768" height="960" rx="32" fill="none" stroke="#444444" stroke-width="6" />
    <rect x="131" y="35" width="762" height="954" rx="29" fill="none" stroke="#1a1a1a" stroke-width="4" />

    <!-- Insertion Arrow -->
    <path d="M 220 80 L 220 50 L 240 50 L 240 80 L 250 80 L 230 105 L 210 80 Z" fill="#1a1a1a" />
    <path d="M 220 80 L 220 50 L 240 50 L 240 80 L 250 80 L 230 105 L 210 80 Z" fill="none" stroke="#444444" stroke-width="2" />

    <!-- Disk Window (Magnetic Media) -->
    <g filter="url(#innerShadow)">
      <rect x="362" y="120" width="300" height="120" rx="60" fill="#111111" />
    </g>
    <rect x="382" y="130" width="260" height="100" rx="50" fill="#050505" />
    <!-- Media reflection -->
    <path d="M 390 140 Q 512 130 634 140 A 40 40 0 0 1 634 200 Q 512 190 390 200 A 40 40 0 0 1 390 140 Z" fill="#1a1a1a" opacity="0.5" />

    <!-- Metal Hub -->
    <circle cx="512" cy="440" r="140" fill="url(#metal)" filter="url(#dropShadow)" />
    <circle cx="512" cy="440" r="138" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
    <circle cx="512" cy="440" r="45" fill="url(#metalDark)" filter="url(#innerShadow)" />
    
    <!-- 6-hole pattern -->
    <circle cx="592" cy="440" r="16" fill="#222222" filter="url(#innerShadow)" />
    <circle cx="552" cy="509.3" r="16" fill="#222222" filter="url(#innerShadow)" />
    <circle cx="472" cy="509.3" r="16" fill="#222222" filter="url(#innerShadow)" />
    <circle cx="432" cy="440" r="16" fill="#222222" filter="url(#innerShadow)" />
    <circle cx="472" cy="370.7" r="16" fill="#222222" filter="url(#innerShadow)" />
    <circle cx="552" cy="370.7" r="16" fill="#222222" filter="url(#innerShadow)" />

    <!-- Label Area -->
    <g transform="translate(0, 620)">
      <!-- Label Base -->
      <rect x="148" y="0" width="728" height="352" rx="16" fill="#f4f4f4" filter="url(#dropShadow)" />
      
      <!-- Red Header Stripe -->
      <path d="M 148 16 A 16 16 0 0 1 164 0 L 860 0 A 16 16 0 0 1 876 16 L 876 90 L 148 90 Z" fill="#d32f2f" />
      
      <!-- DiskBender Text -->
      <text x="180" y="65" font-family="Brush Script MT, cursive, Georgia, serif" font-size="64" font-style="italic" font-weight="bold" fill="#ffffff" letter-spacing="2">DiskBender</text>
      
      <!-- Side Number Indicator -->
      <rect x="770" y="20" width="80" height="50" rx="8" fill="#ffffff" />
      <text x="810" y="58" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#d32f2f" text-anchor="middle">1↑</text>
      
      <!-- Ruled Lines -->
      <line x1="180" y1="140" x2="844" y2="140" stroke="#cccccc" stroke-width="4" />
      <line x1="180" y1="190" x2="844" y2="190" stroke="#cccccc" stroke-width="4" />
      <line x1="180" y1="240" x2="844" y2="240" stroke="#cccccc" stroke-width="4" />
      
      <!-- For Single Head Drive -->
      <text x="180" y="125" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#555555">For Single Head Drive</text>
      
      <!-- Cyan/Teal Band -->
      <path d="M 148 272 L 876 272 L 876 336 A 16 16 0 0 1 860 352 L 164 352 A 16 16 0 0 1 148 336 Z" fill="#00838f" />
      
      <!-- CF Logo -->
      <text x="180" y="328" font-family="Arial, sans-serif" font-size="52" font-weight="bold" font-style="italic" fill="#ffffff" letter-spacing="-2">CF</text>
      
      <!-- Compact Floppy Disc -->
      <text x="270" y="320" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Compact Floppy Disc</text>
      
      <!-- CF2 -->
      <text x="770" y="328" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">CF2</text>
    </g>
  </g>
</svg>